name: App smoke

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "data/**/*.ts"
      - "data/**/*.tsx"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "yarn.lock"
      - "tsconfig.json"
      - "next.config.*"
      - "middleware.*"
      - "vercel.json"
      - "scripts/vercel-ignore-build.mjs"
      - ".github/workflows/app-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
